name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The merge queue gates on this job (.mergify.yml). It checks what this pack ships: every
  # skills/*/SKILL.md opens with frontmatter that has a name and a description, and every JSON
  # manifest parses.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Skill frontmatter and JSON manifests
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, existsSync, statSync } from "node:fs";
            import { join } from "node:path";
            const problems = [];
            const skills = existsSync("skills") ? readdirSync("skills").filter((d) => statSync(join("skills", d)).isDirectory()) : [];
            if (skills.length === 0) problems.push("no skills/*/ folders found");
            for (const dir of skills) {
              const file = join("skills", dir, "SKILL.md");
              if (!existsSync(file)) { problems.push(`${file}: missing`); continue; }
              const lines = readFileSync(file, "utf8").split("\n");
              const end = lines.indexOf("---", 1);
              if (lines[0] !== "---" || end < 0) { problems.push(`${file}: no frontmatter block`); continue; }
              const head = lines.slice(1, end);
              const name = head.find((l) => /^name:\s*\S/.test(l));
              const desc = head.findIndex((l) => /^description:/.test(l));
              const descText = desc < 0 ? "" : head[desc].replace(/^description:\s*/, "") + head.slice(desc + 1).filter((l) => /^\s+\S/.test(l)).join(" ");
              if (!name) problems.push(`${file}: frontmatter has no name`);
              if (!descText.trim()) problems.push(`${file}: frontmatter has no description`);
            }
            const json = [];
            const walk = (d) => { for (const e of readdirSync(d)) { if (e === ".git" || e === "node_modules") continue; const p = join(d, e); if (statSync(p).isDirectory()) walk(p); else if (p.endsWith(".json")) json.push(p); } };
            walk(".");
            for (const p of json) { try { JSON.parse(readFileSync(p, "utf8")); } catch (e) { problems.push(`${p}: ${e.message}`); } }
            console.log(`checked ${skills.length} skills and ${json.length} JSON files`);
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          '

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks (history and working tree)
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .
