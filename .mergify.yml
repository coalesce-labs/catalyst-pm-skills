# Mergify merge queue for `catalyst-pm-skills`, the same rules as catalyst-dev-skills and catalyst-cloud-skills.
#
# Entry is opt-OUT, matching `catalyst-cloud`: any pull request against `main` that is green,
# non-draft, and has zero unresolved review threads self-enqueues. To keep one OUT, apply the
# `hold` label — that is the only thing anyone does by hand.
#
# WHY THIS EXISTS: without a queue, Catalyst's merge phase refuses this repository
# (`merge_excluded_no_merge_queue`) and the team's "Merge queue" readiness check fails.
#
# The gates are this repository's own jobs in .github/workflows/ci.yml, added with this file:
# `check` (skill frontmatter and JSON manifests) and `secrets` (gitleaks). Neither is guarded on
# draft state, so a bare `check-success=` is correct.

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base=main
      - -draft
      - label!=hold
      - "#review-threads-unresolved=0"
      - "check-success=check"
      - "check-success=secrets"
    merge_conditions:
      - base=main
      - label!=hold
      - "#review-threads-unresolved=0"
      - "check-success=check"
      - "check-success=secrets"

pull_request_rules:
  # The trigger, not a second gate: its conditions mirror queue_conditions so a pull request that
  # would be admitted is the one that gets enqueued.
  - name: enqueue any green, thread-clean, non-held PR
    conditions:
      - base=main
      - -draft
      - label!=hold
      - "#review-threads-unresolved=0"
      - "check-success=check"
      - "check-success=secrets"
    actions:
      queue: {}

merge_protections:
  # Applies to every non-draft pull request against main regardless of merge path, so a hand-merge
  # cannot skip what the queue enforces.
  - name: no unresolved review threads before merge
    if:
      - base=main
      - -draft
    success_conditions:
      - "#review-threads-unresolved=0"
